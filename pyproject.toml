[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-radar"
version = "0.1.0"
description = "Scans an issue tracker for stalled work and per-person workload."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "urllib3<2; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by starlette's TestClient for the web route tests
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
work-radar = "work_radar.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
